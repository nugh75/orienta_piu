# Nginx configuration per ORIENTA+ Dashboard
# Reverse proxy per Streamlit e Task Runner

# Mappa per gestire WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream streamlit {
    server 127.0.0.1:8501;
}

upstream taskrunner {
    server 127.0.0.1:5001;
}

server {
    listen 8587;
    server_name _;
    
    # Aumenta timeout per SSE e websocket
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    
    # Buffer settings
    proxy_buffering off;
    proxy_cache off;
    
    # Headers comuni
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Task Runner Web UI - route principale
    location /taskrunner {
        # Redirect /taskrunner a /taskrunner/ per consistenza
        rewrite ^/taskrunner$ /taskrunner/ permanent;
    }
    
    location /taskrunner/ {
        proxy_pass http://taskrunner/;
        
        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # Mantieni prefisso per sub-requests
        proxy_set_header X-Script-Name /taskrunner;
    }
    
    # Streamlit WebSocket
    location /_stcore/stream {
        proxy_pass http://streamlit/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    
    # Streamlit health check
    location /_stcore/health {
        proxy_pass http://streamlit/_stcore/health;
    }
    
    # Streamlit static
    location /static {
        proxy_pass http://streamlit/static;
    }
    
    # Tutto il resto a Streamlit (main app)
    location / {
        proxy_pass http://streamlit;
        
        # Websocket support per Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
