services:
  # === WEB RUNNER (Task Runner Flask) ===
  web-runner:
    build: .
    container_name: ptof-web-runner
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      # Makefile e script principali
      - ./Makefile:/app/Makefile:ro
      - ./workflow_notebook.py:/app/workflow_notebook.py:ro
      - ./cleanup_obsolete.py:/app/cleanup_obsolete.py:ro
      - ./scripts:/app/scripts:ro
      # Codice sorgente
      - ./src:/app/src:ro
      - ./app:/app/app:ro
      - ./config:/app/config
      # Dati (read-write per elaborazione)
      - ./data:/app/data
      - ./analysis_results:/app/analysis_results
      - ./reports:/app/reports
      - ./logs:/app/logs
      # PDF
      - ./ptof_inbox:/app/ptof_inbox
      - ./ptof_processed:/app/ptof_processed
      - ./ptof_discarded:/app/ptof_discarded
      - ./ptof_md:/app/ptof_md
      # Configurazione
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Override per usare python di sistema invece di .venv
      - PYTHON=python
      - PIP=pip
    command: ["python", "-m", "src.taskrunner.web", "--host", "0.0.0.0", "--port", "5000"]
    restart: unless-stopped

  # === DASHBOARD (Streamlit) ===
  dashboard:
    build: .
    container_name: orienta-dashboard
    ports:
      - "8587:8587"
    volumes:
      # === DATI (read-only per la dashboard) ===
      - ./data:/app/data:ro                        # CSV, registry (sola lettura)
      - ./analysis_results:/app/analysis_results:ro # Report JSON/MD (sola lettura)
      - ./reports:/app/reports:ro                   # Meta report (sola lettura)

      # === CODICE (hot-reload) ===
      - ./app:/app/app:ro
      - ./src:/app/src:ro
      - ./config:/app/config                      # RW per salvare pesi
      - ./.streamlit:/app/.streamlit:ro

      # === DATI (read-write per funzionalita admin) ===
      - ./ptof_inbox:/app/ptof_inbox               # Upload PTOF
      - ./ptof_processed:/app/ptof_processed:ro    # PDF elaborati (visualizzazione)
      - ./ptof_inviati:/app/ptof_inviati           # PDF inviati spontaneamente
      - ./logs:/app/logs                           # Log dashboard

      # === CONFIGURAZIONE ===
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
