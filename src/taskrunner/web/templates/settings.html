<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTOF Config Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Specific styles for settings page */
        main {
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .settings-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            height: calc(100vh - 120px);
            min-height: 0;
        }

        /* Preset List Panel */
        .preset-list-panel {
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Importante per flex child scroll */
            min-height: 0;
        }

        .preset-list-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #preset-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        /* ... */

        /* Editor Panel */
        .editor-panel {
            padding: 2rem;
            overflow-y: auto;
            height: 100%; /* Occupa tutta l'altezza della cella grid */
            min-height: 0; /* Fix per grid overflow */
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .models-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-primary);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            color: var(--accent-primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
        }

        .btn-delete:hover {
            background: var(--accent-danger);
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">PTOF Task Runner</a> / Settings</h1>
        <div class="button-group">
            <a href="/" class="btn-secondary" style="text-decoration:none; padding:0.5rem 1rem; display:inline-block;">← Back to Runner</a>
        </div>
    </header>

    <main>
        <div class="settings-container">
            <!-- Left: List -->
            <aside class="preset-list-panel">
                <div class="preset-list-header">
                    <h3>Presets</h3>
                    <button id="btn-new-preset" class="btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">+ New</button>
                </div>
                <div id="preset-list">
                    <!-- Loaded via JS -->
                </div>
            </aside>

            <!-- Right: Editor -->
            <section class="editor-panel">
                <form id="preset-form" class="hidden">
                    <div class="editor-header">
                        <h2 id="editor-title">Edit Preset</h2>
                        <div class="button-group">
                            <button type="button" id="btn-delete" class="btn-delete">Delete</button>
                            <button type="submit" id="btn-save" class="btn-primary">Save Changes</button>
                        </div>
                    </div>

                    <input type="hidden" id="preset-id">

                    <!-- Basic Info -->
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" required placeholder="e.g. Local Ollama">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Short description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="ollama">Ollama (Local)</option>
                            <option value="openai">OpenAI / OpenRouter</option>
                            <option value="mixed">Mixed (Hybrid)</option>
                        </select>
                    </div>

                    <!-- Environment (hidden based on type) -->
                    <div id="env-settings">
                         <div class="form-group">
                            <label for="ollama_url">Ollama URL (optional)</label>
                            <input type="text" id="ollama_url" placeholder="http://localhost:11434">
                        </div>
                        <div class="form-group">
                            <label for="base_url">API Base URL (for OpenAI/OpenRouter)</label>
                            <input type="text" id="base_url" placeholder="https://openrouter.ai/api/v1/chat/completions">
                        </div>
                        <div class="form-group">
                            <label for="api_key_env">API Key Env Var</label>
                            <select id="api_key_env">
                                <option value="OPENAI_API_KEY">OPENAI_API_KEY</option>
                                <option value="OPENROUTER_API_KEY">OPENROUTER_API_KEY</option>
                            </select>
                        </div>
                    </div>

                    <!-- Models -->
                    <h3 class="section-title">Role Assignment</h3>
                    <div class="models-grid">
                        <div class="form-group">
                            <label for="model_analyst">Analyst Model</label>
                            <input type="text" id="model_analyst" required placeholder="e.g. gemma3:27b">
                        </div>
                        <div class="form-group">
                            <label for="model_reviewer">Reviewer Model</label>
                            <input type="text" id="model_reviewer" required placeholder="e.g. qwen3:32b">
                        </div>
                        <div class="form-group">
                            <label for="model_refiner">Refiner Model</label>
                            <input type="text" id="model_refiner" required placeholder="e.g. gemma3:27b">
                        </div>
                        <div class="form-group">
                            <label for="model_synthesizer">Synthesizer Model</label>
                            <input type="text" id="model_synthesizer" required placeholder="e.g. gpt-4o">
                        </div>
                    </div>
                </form>

                <div id="empty-state" style="text-align: center; color: var(--text-secondary); margin-top: 5rem;">
                    <p>Select a preset to edit or create a new one.</p>
                </div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
